AllCops:
  TargetRubyVersion: 3.2
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "bin/**/*"

# The SDK deliberately exposes a get_*/set_* accessor API and is_*? predicates
# to stay consistent with the other IBM App Configuration language SDKs
# (Go, Java, Node). These naming/style cops conflict with that public contract.
Naming/AccessorMethodName:
  Enabled: false
Naming/PredicatePrefix:
  Enabled: false
Style/OptionalBooleanParameter:
  Enabled: false
Style/Documentation:
  Enabled: false

# Numeric equality comparisons are intentional in the segment rule operators
# ("is"/"isNot") where attribute values are compared as floats.
Lint/FloatComparison:
  Enabled: false

# The WebSocket connection manager intentionally breaks out of iterators and
# swallows exceptions while managing the background connection lifecycle.
Lint/NonLocalExitFromIterator:
  Exclude:
    - "lib/ibm_appconfiguration_ruby_sdk/configurations/internal/websocket_client/connection_manager.rb"
Lint/SuppressedException:
  Exclude:
    - "lib/ibm_appconfiguration_ruby_sdk/configurations/internal/websocket_client/connection_manager.rb"

Style/ConditionalAssignment:
  EnforcedStyle: assign_to_condition
  SupportedStyles:
    - assign_to_condition
    - assign_inside_condition
  SingleLineConditionsOnly: true
  IncludeTernaryExpressions: true
  Enabled: false
Style/RaiseArgs:
  EnforcedStyle: compact
  SupportedStyles:
    - compact # raise Exception.new(msg)
    - exploded # raise Exception, msg
Style/StringLiterals:
  EnforcedStyle: double_quotes
  SupportedStyles:
    - single_quotes
    - double_quotes
  ConsistentQuotesInMultiline: false
  Enabled: true
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
  SupportedStyles:
    - single_quotes
    - double_quotes
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/BlockNesting:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Layout/LineLength:
  Max: 160
  AllowHeredoc: true
  AllowURI: true
  URISchemes:
    - http
    - https
  AllowCopDirectives: false
  AllowedPatterns: [ ]
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
